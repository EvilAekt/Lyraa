name: CI / Quality & Security Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-test:
    name: Build, Audit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: TypeScript Compilation & Typecheck
        run: npm run build

      - name: Secret Scan (Gitleaks Action)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Dependency Supply Chain Security Audit (SEC-10)
        run: npm audit --audit-level=high

      - name: Run Full Automated Test Suite (TC-01..TC-20)
        run: npm test
        env:
          NODE_ENV: test
          DEBUG_SAVE_AUDIO: 'false'
